name: build-veex

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

env:
  APP_NAME: "VEEX"
  BUNDLE_ID: "com.veex.external27"
  OLD_REPO: "https://github.com/lyvstoremx/VEEX-EXTERNAL.git"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Herramientas
        run: |
          set -e
          brew install ffmpeg || true
          python3 -m venv $RUNNER_TEMP/venv
          source $RUNNER_TEMP/venv/bin/activate
          pip install --upgrade pip
          pip install lief pillow
          echo "$RUNNER_TEMP/venv/bin" >> $GITHUB_PATH

      - name: Recursos del repo viejo
        run: |
          set -e
          git clone --depth 1 "$OLD_REPO" $RUNNER_TEMP/old
          mkdir -p "$GITHUB_WORKSPACE/patches" "$GITHUB_WORKSPACE/voices"
          cp -R $RUNNER_TEMP/old/patches/. "$GITHUB_WORKSPACE/patches/" || true
          cp -R $RUNNER_TEMP/old/voices/. "$GITHUB_WORKSPACE/voices/" || true
          cp $RUNNER_TEMP/old/keys.json "$GITHUB_WORKSPACE/keys.json" || true
          ls patches | head -20

      - name: IPA
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          SRC=$(ls *.ipa 2>/dev/null | head -1 || true)
          if [ -z "$SRC" ]; then SRC=$(ls $RUNNER_TEMP/old/*.ipa 2>/dev/null | head -1 || true); fi
          if [ -n "$SRC" ]; then
            echo "usando $SRC"
            cp "$SRC" app.ipa
          elif [ -n "${{ secrets.IPA_URL }}" ]; then
            curl -fL --retry 3 -o app.ipa "${{ secrets.IPA_URL }}"
          else
            echo "ERROR: no se encontro ninguna .ipa"; exit 1
          fi
          ls -lh app.ipa
          unzip -q app.ipa -d work
          ls -la work/Payload

      - name: Compilar dylib
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          mkdir -p out
          xcrun -sdk iphoneos swiftc \
            -target arm64-apple-ios16.0 \
            -emit-library -module-name Veex \
            -o out/libveex.dylib \
            veex/main.m veex/VXPanel.swift veex/VXPreview.swift veex/VXTheme.swift \
            -framework UIKit -framework Foundation -framework SwiftUI \
            -framework QuartzCore -framework AVFoundation
          lipo -info out/libveex.dylib
          otool -L out/libveex.dylib | head -12

      - name: Inyectar
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          APP=$(ls -d work/Payload/*.app | head -1)
          BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          mkdir -p "$APP/Frameworks"
          cp out/libveex.dylib "$APP/Frameworks/libveex.dylib"
          python3 - "$BIN" <<'PY'
          import sys, lief
          p = sys.argv[1]
          b = lief.MachO.parse(p).at(0)
          name = "@executable_path/Frameworks/libveex.dylib"
          cmd = None
          for make in (lambda: lief.MachO.DylibCommand.load_dylib(name),
                       lambda: lief.MachO.DylibCommand.dylib(name),
                       lambda: lief.MachO.DylibCommand(name)):
              try:
                  cmd = make()
                  if cmd is not None: break
              except Exception as e:
                  print("variante fallo:", e)
          if cmd is None:
              raise SystemExit("no se pudo crear LC_LOAD_DYLIB")
          b.add(cmd)
          b.write(p)
          print("LC_LOAD_DYLIB agregado")
          PY
          otool -L "$BIN" | grep -q libveex.dylib || { echo "FALLO LA INYECCION"; exit 1; }
          echo "inyectado en $BIN"

      - name: Contenido
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          APP=$(ls -d work/Payload/*.app | head -1)
          mkdir -p "$APP/veex"
          cp patches/*.3105 "$APP/veex/" 2>/dev/null || true
          cp voices/*.mp3 "$APP/veex/" 2>/dev/null || true
          cp keys.json "$APP/veex/keys.json" 2>/dev/null || true
          ls "$APP/veex" | wc -l

      - name: Nombre y splash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          APP=$(ls -d work/Payload/*.app | head -1)
          PL="$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $APP_NAME" "$PL" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string $APP_NAME" "$PL"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName $APP_NAME" "$PL" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleName string $APP_NAME" "$PL"
          /usr/libexec/PlistBuddy -c "Delete :UILaunchStoryboardName" "$PL" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :UILaunchScreen" "$PL" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen dict" "$PL"
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen:UIImageName string LaunchLogo" "$PL"
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen:UIImageRespectsSafeAreaInsets bool false" "$PL" 2>/dev/null || true
          for d in "$APP"/*.lproj; do
            [ -d "$d" ] || continue
            printf '"CFBundleDisplayName" = "%s";\n"CFBundleName" = "%s";\n' "$APP_NAME" "$APP_NAME" > "$d/InfoPlist.strings"
          done
          SRC=""
          for c in IMG_5384.png IMG_5380.png; do
            if [ -f "$c" ]; then SRC="$c"; break; fi
          done
          if [ -n "$SRC" ]; then
            python3 - "$SRC" "$APP/LaunchLogo.png" <<'PY'
          from PIL import Image
          import sys
          src = Image.open(sys.argv[1]).convert("RGBA")
          W, H = 1290, 2796
          bg = Image.new("RGB", (W, H), (0, 0, 0))
          w = int(W * 0.55)
          lh = int(src.height * w / src.width)
          logo = src.resize((w, lh), Image.LANCZOS)
          bg.paste(logo, ((W - w) // 2, (H - lh) // 2), logo)
          bg.save(sys.argv[2])
          print("splash", bg.size)
          PY
          fi
          echo "plist y splash listos"

      - name: Icono
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          SRC=""
          for c in IMG_5384.png IMG_5380.png icono.png; do
            if [ -f "$c" ]; then SRC="$c"; break; fi
          done
          APP=$(ls -d work/Payload/*.app | head -1)
          if [ -z "$SRC" ]; then echo "sin logo, se deja el icono original"; exit 0; fi
          python3 - "$SRC" master.png <<'PY'
          from PIL import Image
          import sys
          src = Image.open(sys.argv[1]).convert("RGBA")
          W = 1024
          bg = Image.new("RGB", (W, W), (0, 0, 0))
          w = int(W * 0.86)
          lh = int(src.height * w / src.width)
          logo = src.resize((w, lh), Image.LANCZOS)
          bg.paste(logo, ((W - w) // 2, (W - lh) // 2), logo)
          bg.save(sys.argv[2])
          print("master", bg.size)
          PY
          CAT=$RUNNER_TEMP/Assets.xcassets
          XC=$CAT/AppIcon.appiconset
          rm -rf $CAT
          mkdir -p "$XC" $RUNNER_TEMP/xcout
          printf '{\n  "info" : {\n    "author" : "xcode",\n    "version" : 1\n  }\n}\n' > $CAT/Contents.json
          for s in 20 29 40 58 60 76 80 87 120 152 167 180 1024; do
            sips -z $s $s master.png --out "$XC/i$s.png" >/dev/null 2>&1 || true
          done
          python3 - "$XC/Contents.json" <<'PY'
          import json, sys
          imgs = [
            ("20x20","iphone","i40.png","2x"),("20x20","iphone","i60.png","3x"),
            ("29x29","iphone","i29.png","1x"),("29x29","iphone","i58.png","2x"),
            ("29x29","iphone","i87.png","3x"),("40x40","iphone","i40.png","1x"),
            ("40x40","iphone","i80.png","2x"),("40x40","iphone","i120.png","3x"),
            ("60x60","iphone","i120.png","2x"),("60x60","iphone","i180.png","3x"),
            ("76x76","ipad","i76.png","1x"),("76x76","ipad","i152.png","2x"),
            ("83.5x83.5","ipad","i167.png","2x"),("1024x1024","ios-marketing","i1024.png","1x"),
          ]
          data = {"images":[{"size":a,"idiom":b,"filename":c,"scale":d} for a,b,c,d in imgs],
                  "info":{"version":1,"author":"xcode"}}
          json.dump(data, open(sys.argv[1],"w"), indent=2)
          print("contents ok")
          PY
          set +e
          xcrun actool $CAT \
            --compile $RUNNER_TEMP/xcout \
            --platform iphoneos --minimum-deployment-target 16.0 \
            --target-device iphone --target-device ipad \
            --app-icon AppIcon \
            --output-partial-info-plist $RUNNER_TEMP/partial.plist \
            > $RUNNER_TEMP/actool.log 2>&1
          RC=$?
          set -e
          cat $RUNNER_TEMP/actool.log || true
          if [ $RC -eq 0 ] && [ -f $RUNNER_TEMP/xcout/Assets.car ]; then
            cp $RUNNER_TEMP/xcout/Assets.car "$APP/Assets.car"
            echo "Assets.car reemplazado"
          else
            echo "actool fallo"
            exit 1
          fi

      - name: Firmar
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          APP=$(ls -d work/Payload/*.app | head -1)
          find "$APP" -name "*.dylib" -exec codesign --force --sign - --timestamp=none {} \;
          codesign --force --sign - --timestamp=none "$APP"
          codesign -dv "$APP" 2>&1 | head -4

      - name: Ver plist
        run: |
          APP=$(ls -d work/Payload/*.app | head -1)
          /usr/libexec/PlistBuddy -c "Print" "$APP/Info.plist" | head -40

      - name: Empaquetar
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/work"
          rm -f ../VEEX.ipa
          zip -qry ../VEEX.ipa Payload

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: VEEX.ipa
          path: VEEX.ipa
