name: build-veex
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Traer recursos
        run: |
          set -e
          git clone --depth 1 https://github.com/lyvstoremx/VEEX-EXTERNAL "$RUNNER_TEMP/src"
      - name: Compilar
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p build
          xcrun --sdk iphoneos clang -target arm64-apple-ios16.0 -isysroot "$SDK" \
            -fobjc-arc -O2 -c veex/main.m -o build/main.o
          xcrun --sdk iphoneos swiftc -target arm64-apple-ios16.0 -sdk "$SDK" -O \
            -emit-library -o build/libveex.dylib \
            veex/VXTheme.swift veex/VXPanel.swift veex/VXPreview.swift build/main.o \
            -framework UIKit -framework SwiftUI
          codesign --force --sign - build/libveex.dylib
      - name: Preparar
        run: |
          set -e
          W="$RUNNER_TEMP/w" && mkdir -p "$W" && cd "$W"
          curl -sSL -o base.ipa "https://github.com/lyvstoremx/VEEX-EXTERNAL/raw/main/3105ios27.ipa"
          unzip -o base.ipa >/dev/null
          APP=$(find "$W/Payload" -maxdepth 1 -name '*.app' | head -1)
          EXE=$(python3 -c "import plistlib,sys;print(plistlib.load(open(sys.argv[1],'rb'))['CFBundleExecutable'])" "$APP/Info.plist")
          mkdir -p "$APP/veex"
          cp -R "$RUNNER_TEMP/src/patches/." "$APP/veex/"
          cp -R "$RUNNER_TEMP/src/voices/." "$APP/veex/"
          cp "$GITHUB_WORKSPACE/IMG_5360.png" "$APP/veex/vx_front.png"
          cp "$GITHUB_WORKSPACE/IMG_5365.png" "$APP/veex/vx_right.png"
          cp "$GITHUB_WORKSPACE/IMG_5361.png" "$APP/veex/vx_back.png"
          cp "$GITHUB_WORKSPACE/IMG_5364.png" "$APP/veex/vx_left.png"
          rm -rf "$APP/veex/patches" "$APP/veex/voices"
          echo "APP=$APP" >> $GITHUB_ENV
          echo "EXE=$EXE" >> $GITHUB_ENV
      - name: Nombre
        run: |
          set -e
          python3 - "$APP" <<'PY'
          import sys, os, plistlib
          app = sys.argv[1]
          ip = os.path.join(app, 'Info.plist')
          p = plistlib.load(open(ip, 'rb'))
          p.pop('UILaunchStoryboardName', None)
          p.pop('UILaunchStoryboardFile', None)
          p['UILaunchScreen'] = {}
          p['CFBundleDisplayName'] = 'VEEX'
          p['CFBundleName'] = 'VEEX'
          p['CFBundleIconName'] = 'AppIcon'
          p.pop('CFBundleIcons', None)
          p.pop('CFBundleIcons~ipad', None)
          plistlib.dump(p, open(ip, 'wb'))
          for d in os.listdir(app):
              if d.endswith('.lproj'):
                  open(os.path.join(app, d, 'InfoPlist.strings'), 'w').write(
                      '"CFBundleDisplayName" = "VEEX";\n"CFBundleName" = "VEEX";\n')
          print("nombre listo")
          PY
      - name: Icono
        run: |
          set -e
          test -f "$GITHUB_WORKSPACE/IMG_5380.png" || { echo "falta IMG_5380.png"; exit 1; }
          SRC="$RUNNER_TEMP/src.png"
          sips -p 1360 1360 --padColor FFFFFF "$GITHUB_WORKSPACE/IMG_5380.png" --out "$SRC" >/dev/null
          sips -z 1024 1024 "$SRC" >/dev/null
          SET="$RUNNER_TEMP/cat.xcassets/AppIcon.appiconset"
          mkdir -p "$SET"
          cp "$SRC" "$SET/icon.png"
          cat > "$SET/Contents.json" <<'JSON'
          {
            "images": [
              { "filename": "icon.png", "idiom": "universal", "platform": "ios", "size": "1024x1024" }
            ],
            "info": { "author": "xcode", "version": 1 }
          }
          JSON
          OUT="$RUNNER_TEMP/out" && mkdir -p "$OUT"
          xcrun actool --compile "$OUT" \
            --platform iphoneos --minimum-deployment-target 16.0 \
            --app-icon AppIcon --output-partial-info-plist "$RUNNER_TEMP/partial.plist" \
            "$RUNNER_TEMP/cat.xcassets" >/dev/null
          cp "$OUT/Assets.car" "$APP/Assets.car"
          rm -f "$APP"/AppIcon*.png
          echo "icono compilado"
      - name: Inyectar
        run: |
          set -e
          python3 -m venv "$RUNNER_TEMP/venv"
          source "$RUNNER_TEMP/venv/bin/activate"
          pip install --quiet lief
          mkdir -p "$APP/Frameworks"
          cp "$GITHUB_WORKSPACE/build/libveex.dylib" "$APP/Frameworks/"
          python3 - "$APP/$EXE" <<'PY'
          import lief, sys
          b = lief.MachO.parse(sys.argv[1]).at(0)
          b.add_library("@executable_path/Frameworks/libveex.dylib")
          b.write(sys.argv[1])
          PY
          otool -L "$APP/$EXE" | grep -q libveex && echo "INYECTADA" || { echo "NO INYECTADA"; exit 1; }
          codesign --force --sign - "$APP/Frameworks/libveex.dylib"
          codesign --force --sign - "$APP"
          cd "$RUNNER_TEMP/w" && zip -qry "$GITHUB_WORKSPACE/VEEX.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: VEEX
          path: VEEX.ipa
