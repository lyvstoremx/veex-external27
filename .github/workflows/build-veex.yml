name: build-veex
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Traer recursos
        run: |
          set -e
          git clone --depth 1 https://github.com/lyvstoremx/VEEX-EXTERNAL "$RUNNER_TEMP/src"
      - name: Compilar
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p build
          xcrun --sdk iphoneos clang -target arm64-apple-ios16.0 -isysroot "$SDK" \
            -fobjc-arc -O2 -c veex/main.m -o build/main.o
          xcrun --sdk iphoneos swiftc -target arm64-apple-ios16.0 -sdk "$SDK" -O \
            -emit-library -o build/libveex.dylib \
            veex/VXTheme.swift veex/VXPanel.swift veex/VXPreview.swift build/main.o \
            -framework UIKit -framework SwiftUI
          codesign --force --sign - build/libveex.dylib
      - name: Preparar
        run: |
          set -e
          W="$RUNNER_TEMP/w" && mkdir -p "$W" && cd "$W"
          curl -sSL -o base.ipa "https://github.com/lyvstoremx/VEEX-EXTERNAL/raw/main/3105ios27.ipa"
          unzip -o base.ipa >/dev/null
          APP=$(find "$W/Payload" -maxdepth 1 -name '*.app' | head -1)
          EXE=$(python3 -c "import plistlib,sys;print(plistlib.load(open(sys.argv[1],'rb'))['CFBundleExecutable'])" "$APP/Info.plist")
          mkdir -p "$APP/veex"
          cp -R "$RUNNER_TEMP/src/patches/." "$APP/veex/"
          cp -R "$RUNNER_TEMP/src/voices/." "$APP/veex/"
          cp "$GITHUB_WORKSPACE/IMG_5360.png" "$APP/veex/vx_front.png"
          cp "$GITHUB_WORKSPACE/IMG_5365.png" "$APP/veex/vx_right.png"
          cp "$GITHUB_WORKSPACE/IMG_5361.png" "$APP/veex/vx_back.png"
          cp "$GITHUB_WORKSPACE/IMG_5364.png" "$APP/veex/vx_left.png"
          rm -rf "$APP/veex/patches" "$APP/veex/voices"
          echo "APP=$APP" >> $GITHUB_ENV
          echo "EXE=$EXE" >> $GITHUB_ENV
      - name: Nombre, icono y splash
        run: |
          set -e
          test -f "$GITHUB_WORKSPACE/IMG_5384.png" || { echo "falta IMG_5384.png"; exit 1; }
          CAT="$RUNNER_TEMP/cat.xcassets"
          mkdir -p "$CAT/AppIcon.appiconset" "$CAT/LaunchLogo.imageset" "$CAT/LaunchBg.colorset"

          SRC="$RUNNER_TEMP/base.png"
          sips -p 1360 1360 --padColor 000000 "$GITHUB_WORKSPACE/IMG_5384.png" --out "$SRC" >/dev/null
          cp "$SRC" "$CAT/AppIcon.appiconset/icon.png"
          cat > "$CAT/AppIcon.appiconset/Contents.json" <<'JSON'
          {"images":[{"filename":"icon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}
          JSON

          sips -Z 640 "$SRC" --out "$CAT/LaunchLogo.imageset/logo.png" >/dev/null
          cat > "$CAT/LaunchLogo.imageset/Contents.json" <<'JSON'
          {"images":[{"filename":"logo.png","idiom":"universal","scale":"1x"}],"info":{"author":"xcode","version":1}}
          JSON
          cat > "$CAT/LaunchBg.colorset/Contents.json" <<'JSON'
          {"colors":[{"color":{"color-space":"srgb","components":{"alpha":"1.000","blue":"0.000","green":"0.000","red":"0.000"}},"idiom":"universal"}],"info":{"author":"xcode","version":1}}
          JSON

          OUT="$RUNNER_TEMP/out" && mkdir -p "$OUT"
          xcrun actool --compile "$OUT" \
            --platform iphoneos --minimum-deployment-target 16.0 \
            --app-icon AppIcon --output-partial-info-plist "$RUNNER_TEMP/partial.plist" \
            "$CAT" >/dev/null
          test -f "$OUT/Assets.car" || { echo "actool no genero Assets.car"; exit 1; }
          cp "$OUT/Assets.car" "$APP/Assets.car"
          rm -f "$APP"/AppIcon*.png

          rm -rf "$APP"/*.storyboardc "$APP"/*.nib "$APP"/Base.lproj
          python3 - "$APP/Info.plist" <<'PY'
          import sys, plistlib
          p = plistlib.load(open(sys.argv[1], 'rb'))
          for k in ('UILaunchStoryboardName', 'UILaunchStoryboardFile',
                    'UILaunchStoryboardName~ipad', 'CFBundleIcons', 'CFBundleIcons~ipad'):
              p.pop(k, None)
          p['CFBundleIconName'] = 'AppIcon'
          p['UILaunchScreen'] = {'UIImageName': 'LaunchLogo', 'UIColorName': 'LaunchBg'}
          p['UIUserInterfaceStyle'] = 'Dark'
          p['CFBundleDisplayName'] = 'VEEX'
          p['CFBundleName'] = 'VEEX'
          v = p.get('CFBundleVersion', '1')
          try:
              p['CFBundleVersion'] = str(int(v) + 1)
          except Exception:
              p['CFBundleVersion'] = '2'
          plistlib.dump(p, open(sys.argv[1], 'wb'))
          print("version", p['CFBundleVersion'])
          PY
          for d in "$APP"/*.lproj; do
            [ -d "$d" ] && printf '"CFBundleDisplayName" = "VEEX";\n"CFBundleName" = "VEEX";\n' > "$d/InfoPlist.strings"
          done
          ls -la "$APP/Assets.car"
      - name: Inyectar
        run: |
          set -e
          python3 -m venv "$RUNNER_TEMP/venv"
          source "$RUNNER_TEMP/venv/bin/activate"
          pip install --quiet lief
          mkdir -p "$APP/Frameworks"
          cp "$GITHUB_WORKSPACE/build/libveex.dylib" "$APP/Frameworks/"
          python3 - "$APP/$EXE" <<'PY'
          import lief, sys
          b = lief.MachO.parse(sys.argv[1]).at(0)
          b.add_library("@executable_path/Frameworks/libveex.dylib")
          b.write(sys.argv[1])
          PY
          otool -L "$APP/$EXE" | grep -q libveex && echo "INYECTADA" || { echo "NO INYECTADA"; exit 1; }
          codesign --force --sign - "$APP/Frameworks/libveex.dylib"
          codesign --force --sign - "$APP"
          cd "$RUNNER_TEMP/w" && zip -qry "$GITHUB_WORKSPACE/VEEX.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: VEEX
          path: VEEX.ipa
