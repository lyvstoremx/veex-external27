name: build-veex

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

env:
  APP_NAME: "VEEX"
  BUNDLE_ID: "com.veex.external27"
  OLD_REPO: "https://github.com/lyvstoremx/VEEX-EXTERNAL.git"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Herramientas
        run: |
          set -e
          brew install ffmpeg || true
          python3 -m venv $RUNNER_TEMP/venv
          source $RUNNER_TEMP/venv/bin/activate
          pip install --upgrade pip
          pip install lief
          echo "$RUNNER_TEMP/venv/bin" >> $GITHUB_PATH

      - name: Recursos del repo viejo
        run: |
          set -e
          git clone --depth 1 "$OLD_REPO" $RUNNER_TEMP/old
          mkdir -p "$GITHUB_WORKSPACE/patches" "$GITHUB_WORKSPACE/voices"
          cp -R $RUNNER_TEMP/old/patches/. "$GITHUB_WORKSPACE/patches/" || true
          cp -R $RUNNER_TEMP/old/voices/. "$GITHUB_WORKSPACE/voices/" || true
          cp $RUNNER_TEMP/old/keys.json "$GITHUB_WORKSPACE/keys.json" || true
          ls patches | head -20

      - name: IPA
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          SRC=$(ls *.ipa 2>/dev/null | head -1 || true)
          if [ -z "$SRC" ]; then SRC=$(ls $RUNNER_TEMP/old/*.ipa 2>/dev/null | head -1 || true); fi
          if [ -n "$SRC" ]; then
            echo "usando $SRC"
            cp "$SRC" app.ipa
          elif [ -n "${{ secrets.IPA_URL }}" ]; then
            curl -fL --retry 3 -o app.ipa "${{ secrets.IPA_URL }}"
          else
            echo "ERROR: no se encontro ninguna .ipa"; exit 1
          fi
          ls -lh app.ipa
          unzip -q app.ipa -d work
          ls -la work/Payload

      - name: Compilar dylib
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          mkdir -p out
          xcrun -sdk iphoneos swiftc \
            -target arm64-apple-ios16.0 \
            -emit-library -module-name Veex \
            -o out/libveex.dylib \
            veex/main.m veex/VXPanel.swift veex/VXPreview.swift veex/VXTheme.swift \
            -framework UIKit -framework Foundation -framework SwiftUI \
            -framework QuartzCore -framework AVFoundation
          lipo -info out/libveex.dylib
          otool -L out/libveex.dylib | head -12

      - name: Inyectar
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          APP=$(ls -d work/Payload/*.app | head -1)
          BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          mkdir -p "$APP/Frameworks"
          cp out/libveex.dylib "$APP/Frameworks/libveex.dylib"
          python3 - "$BIN" <<'PY'
          import sys, lief
          p = sys.argv[1]
          b = lief.MachO.parse(p)
          b = b.at(0)
          name = "@executable_path/Frameworks/libveex.dylib"
          try:
              cmd = lief.MachO.DylibCommand.dylib(name)
          except Exception:
              cmd = lief.MachO.DylibCommand.create(name)
          b.add(cmd)
          b.write(p)
          print("LC_LOAD_DYLIB agregado")
          PY
          otool -L "$BIN" | grep -q libveex.dylib || { echo "FALLO LA INYECCION"; exit 1; }
          echo "inyectado en $BIN"

      - name: Contenido
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          APP=$(ls -d work/Payload/*.app | head -1)
          mkdir -p "$APP/veex"
          cp patches/*.3105 "$APP/veex/" 2>/dev/null || true
          cp voices/*.mp3 "$APP/veex/" 2>/dev/null || true
          cp keys.json "$APP/veex/keys.json" 2>/dev/null || true
          ls "$APP/veex" | wc -l

      - name: Nombre y splash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          APP=$(ls -d work/Payload/*.app | head -1)
          PL="$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $APP_NAME" "$PL" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string $APP_NAME" "$PL"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName $APP_NAME" "$PL" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleName string $APP_NAME" "$PL"
          /usr/libexec/PlistBuddy -c "Delete :UILaunchStoryboardName" "$PL" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :UILaunchScreen" "$PL" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen dict" "$PL"
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen:UIImageName string LaunchLogo" "$PL"
          for d in "$APP"/*.lproj; do
            [ -d "$d" ] || continue
            printf '"CFBundleDisplayName" = "%s";\n"CFBundleName" = "%s";\n' "$APP_NAME" "$APP_NAME" > "$d/InfoPlist.strings"
          done
          for s in LaunchLogo.png LaunchLogo@2x.png LaunchLogo@3x.png; do
            [ -f "$s" ] && cp "$s" "$APP/$s"
          done
          if [ ! -f "$APP/LaunchLogo.png" ] && [ -f IMG_5384.png ]; then
            sips -z 1024 1024 IMG_5384.png --out "$APP/LaunchLogo.png" >/dev/null 2>&1
          fi
          echo "plist listo"

      - name: Icono
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          SRC=""
          for c in IMG_5384.png IMG_5380.png icono.png; do
            if [ -f "$c" ]; then SRC="$c"; break; fi
          done
          APP=$(ls -d work/Payload/*.app | head -1)
          if [ -z "$SRC" ]; then echo "sin logo, se deja el icono original"; exit 0; fi
          XC=$RUNNER_TEMP/Assets.xcassets/AppIcon.appiconset
          rm -rf $RUNNER_TEMP/Assets.xcassets
          mkdir -p "$XC"
          for s in 20 29 40 58 60 76 80 87 120 152 167 180 1024; do
            sips -z $s $s "$SRC" --out "$XC/i$s.png" >/dev/null 2>&1 || true
          done
          cat > "$XC/Contents.json" <<'JSON'
          {
            "images": [
              {"size":"20x20","idiom":"iphone","filename":"i40.png","scale":"2x"},
              {"size":"20x20","idiom":"iphone","filename":"i60.png","scale":"3x"},
              {"size":"29x29","idiom":"iphone","filename":"i29.png","scale":"1x"},
              {"size":"29x29","idiom":"iphone","filename":"i58.png","scale":"2x"},
              {"size":"29x29","idiom":"iphone","filename":"i87.png","scale":"3x"},
              {"size":"40x40","idiom":"iphone","filename":"i40.png","scale":"1x"},
              {"size":"40x40","idiom":"iphone","filename":"i80.png","scale":"2x"},
              {"size":"40x40","idiom":"iphone","filename":"i120.png","scale":"3x"},
              {"size":"60x60","idiom":"iphone","filename":"i120.png","scale":"2x"},
              {"size":"60x60","idiom":"iphone","filename":"i180.png","scale":"3x"},
              {"size":"76x76","idiom":"ipad","filename":"i76.png","scale":"1x"},
              {"size":"76x76","idiom":"ipad","filename":"i152.png","scale":"2x"},
              {"size":"83.5x83.5","idiom":"ipad","filename":"i167.png","scale":"2x"},
              {"size":"1024x1024","idiom":"ios-marketing","filename":"i1024.png","scale":"1x"}
            ],
            "info": {"version":1,"author":"xcode"}
          }
          JSON
          set +e
          xcrun actool $RUNNER_TEMP/Assets.xcassets \
            --compile $RUNNER_TEMP/xcout \
            --platform iphoneos --minimum-deployment-target 16.0 \
            --app-icon AppIcon \
            --output-partial-info-plist $RUNNER_TEMP/partial.plist \
            > $RUNNER_TEMP/actool.log 2>&1
          RC=$?
          set -e
          if [ $RC -eq 0 ] && [ -f $RUNNER_TEMP/xcout/Assets.car ]; then
            cp $RUNNER_TEMP/xcout/Assets.car "$APP/Assets.car"
            echo "Assets.car reemplazado"
          else
            echo "actool fallo, respaldo por PNG suelto"
            cat $RUNNER_TEMP/actool.log || true
          fi

      - name: Firmar
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          APP=$(ls -d work/Payload/*.app | head -1)
          find "$APP" -name "*.dylib" -exec codesign --force --sign - --timestamp=none {} \;
          codesign --force --sign - --timestamp=none "$APP"
          codesign -dv "$APP" 2>&1 | head -4

      - name: Ver plist
        run: |
          APP=$(ls -d work/Payload/*.app | head -1)
          /usr/libexec/PlistBuddy -c "Print" "$APP/Info.plist" | head -40

      - name: Cuadros
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          VID=$(ls ScreenRecording*.mp4 2>/dev/null | head -1 || true)
          if [ -z "$VID" ]; then echo "no hay video"; exit 0; fi
          echo "video: $VID"
          rm -rf frames && mkdir -p frames
          ffmpeg -y -i "$VID" -vf "fps=4,scale=360:-1" frames/f_%03d.png
          ls frames | wc -l

      - name: Publicar cuadros
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          git config user.name "veex-bot"
          git config user.email "bot@veex.local"
          git add -f frames
          git commit -m "cuadros del arranque" || echo "sin cambios"
          git push || true

      - name: Empaquetar
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/work"
          rm -f ../VEEX.ipa
          zip -qry ../VEEX.ipa Payload

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: VEEX.ipa
          path: VEEX.ipa
