name: abi

on:
  workflow_dispatch:

jobs:
  abi:
    runs-on: ubuntu-latest
    steps:
      - name: Herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm unzip
      - name: Repo
        run: git clone --depth 1 https://github.com/lyvstoremx/VEEX-EXTERNAL old
      - name: Extraer
        run: |
          cd old
          IPA=$(ls *.ipa | head -1)
          unzip -q "$IPA" -d x
          APP=$(ls -d x/Payload/*.app | head -1)
          BIN=$(find "$APP" -maxdepth 1 -type f -size +5M | head -1)
          cp "$BIN" ../bin
      - name: Contexto
        run: |
          llvm-objdump --macho -d bin > dis.txt 2>&1
          wc -l dis.txt
          L=$(grep -n "bl .*_tunnel_create_rppairing_multihost" dis.txt | head -1 | cut -d: -f1)
          C=$(grep -n "^10056ab58:" dis.txt | head -1 | cut -d: -f1)
          {
            echo "### antes de la llamada (linea $L)"
            sed -n "$((L-170)),$((L+4))p" dis.txt
            echo
            echo "### callee (linea $C)"
            sed -n "${C},$((C+90))p" dis.txt
            echo
            echo "### simbolos C"
            llvm-nm -gU bin | grep -E " T _[a-z]" | grep -iE "tunnel|rsd|provider|pair|afc|file_service|house" | sed -n '1,60p'
          } > abi2.txt 2>&1
          cat abi2.txt >> $GITHUB_STEP_SUMMARY
          wc -l abi2.txt
      - uses: actions/upload-artifact@v4
        with:
          name: abi2
          path: abi2.txt
