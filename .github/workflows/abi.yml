name: abi

on:
  workflow_dispatch:

jobs:
  abi:
    runs-on: ubuntu-latest
    steps:
      - name: Herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm unzip
      - name: Repo
        run: git clone --depth 1 https://github.com/lyvstoremx/VEEX-EXTERNAL old
      - name: Extraer
        run: |
          cd old
          IPA=$(ls *.ipa | head -1)
          unzip -q "$IPA" -d x
          APP=$(ls -d x/Payload/*.app | head -1)
          BIN=$(find "$APP" -maxdepth 1 -type f -size +5M | head -1)
          cp "$BIN" ../bin
      - name: Contexto
        run: |
          set +e
          llvm-objdump --macho -d bin > dis.txt 2>&1
          {
            echo "### registro"
            perl -ne 'BEGIN{$a=hex("100032000");$b=hex("100032c40")} if(/^([0-9a-f]+):/){$x=hex($1); print if $x>=$a && $x<=$b}' dis.txt \
              | grep -E "x3|x7|x22|0xc8|0xf0|0x1cc|bl |sub[[:space:]]+sp|stp[[:space:]]+x29" | sed -n '1,70p'
            echo
            echo "### callee"
            perl -ne 'BEGIN{$a=hex("10056ab58");$b=hex("10056aba8")} if(/^([0-9a-f]+):/){$x=hex($1); print if $x>=$a && $x<=$b}' dis.txt | sed -n '1,90p'
            echo
            echo "### simbolos"
            llvm-nm -gU bin | grep -E " T _[a-z]" | grep -iE "tunnel|rsd|provider|pair|afc|file_service|house" | sed -n '1,60p'
          } > abi2.txt 2>&1
          cat abi2.txt >> $GITHUB_STEP_SUMMARY
          wc -l abi2.txt
      - uses: actions/upload-artifact@v4
        with:
          name: abi2
          path: abi2.txt
