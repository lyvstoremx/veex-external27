name: abi

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  abi:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bajar IPA
        run: |
          set -e
          curl -fL -o app.ipa "https://raw.githubusercontent.com/lyvstoremx/VEEX-EXTERNAL/main/3105ios27.ipa"
          unzip -q app.ipa -d work
          APP=$(ls -d work/Payload/*.app | head -1)
          BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          echo "BIN=$BIN" >> $GITHUB_ENV
      - name: Firmas
        run: |
          set -e
          otool -tvV "$BIN" > dis.txt || true
          : > abi.txt
          for s in tunnel_create_rppairing_multihost rp_pairing_file_read rp_pairing_file_write rsd_get_services; do
            echo "===== $s =====" >> abi.txt
            for n in $(grep -n "_$s" dis.txt | cut -d: -f1 | head -2); do
              a=$(( n > 26 ? n - 26 : 1 ))
              sed -n "${a},$(( n + 6 ))p" dis.txt >> abi.txt
              echo "-----" >> abi.txt
            done
          done
      - name: Publicar
        run: |
          git config user.name veex-bot
          git config user.email bot@veex.local
          git add -f abi.txt
          git commit -m abi || true
          git push || true
      - uses: actions/upload-artifact@v4
        with:
          name: abi
          path: abi.txt
