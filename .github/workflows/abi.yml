name: abi

on:
  workflow_dispatch:

jobs:
  abi:
    runs-on: ubuntu-latest
    steps:
      - name: Herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm unzip
      - name: Repo
        run: git clone --depth 1 https://github.com/lyvstoremx/VEEX-EXTERNAL old
      - name: Extraer
        run: |
          cd old
          IPA=$(ls *.ipa | head -1)
          unzip -q "$IPA" -d x
          APP=$(ls -d x/Payload/*.app | head -1)
          BIN=$(find "$APP" -maxdepth 1 -type f -size +5M | head -1)
          cp "$BIN" ../bin
      - name: Contexto
        run: |
          set +e
          llvm-objdump --macho -d bin > dis.txt 2>&1
          {
            echo "### origen de x3"
            perl -ne 'BEGIN{$a=hex("1000323fc");$b=hex("100032bb8")} if(/^([0-9a-f]+):/){$x=hex($1); print if $x>=$a && $x<=$b}' dis.txt \
              | grep -E "0x140|x3|x22|x21|x19|bl " | sed -n '1,70p'
            echo
            echo "### prologo real"
            perl -ne 'BEGIN{$a=hex("10056ab00");$b=hex("10056aba8")} if(/^([0-9a-f]+):/){$x=hex($1); print if $x>=$a && $x<=$b}' dis.txt | sed -n '1,60p'
            echo
            echo "### fail"
            perl -ne 'BEGIN{$a=hex("10056ac00");$b=hex("10056ad00")} if(/^([0-9a-f]+):/){$x=hex($1); print if $x>=$a && $x<=$b}' dis.txt | sed -n '1,70p'
          } > abi2.txt 2>&1
          cat abi2.txt >> $GITHUB_STEP_SUMMARY
          wc -l abi2.txt
      - uses: actions/upload-artifact@v4
        with:
          name: abi2
          path: abi2.txt
