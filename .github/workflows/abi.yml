name: abi

on:
  workflow_dispatch:

jobs:
  abi:
    runs-on: macos-14
    steps:
      - name: Repo
        run: |
          git clone --depth 1 https://github.com/lyvstoremx/VEEX-EXTERNAL old
      - name: Extraer
        run: |
          cd old
          IPA=$(ls *.ipa | head -1)
          unzip -q "$IPA" -d x
          APP=$(ls -d x/Payload/*.app | head -1)
          EXE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$APP/Info.plist")
          cp "$APP/$EXE" ../bin
      - name: Contexto
        run: |
          {
            echo "===== VENTANA ANTES DE LA LLAMADA ====="
            xcrun llvm-objdump --macho --arch arm64 -d --start-address=0x100032800 --stop-address=0x100032c40 bin
            echo
            echo "===== PROLOGO ====="
            A=$(nm -gU bin | grep " _tunnel_create_rppairing_multihost" | awk '{print $1}')
            echo "addr: $A"
            xcrun llvm-objdump --macho --arch arm64 -d --start-address=0x$A --stop-address=0x$(printf '%x' $((0x$A + 0x60))) bin
            echo
            echo "===== SIMBOLOS ====="
            nm -gU bin | grep -iE "provider|shared|session|default|current|pairing|tunnel|rsd" | head -90
          } > abi2.txt 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: abi2
          path: abi2.txt
