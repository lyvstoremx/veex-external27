name: abi

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  abi:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bajar IPA
        run: |
          set -e
          curl -fL -o app.ipa "https://raw.githubusercontent.com/lyvstoremx/VEEX-EXTERNAL/main/3105ios27.ipa"
          unzip -q app.ipa -d work
          APP=$(ls -d work/Payload/*.app | head -1)
          BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          echo "BIN=$BIN" >> $GITHUB_ENV
      - name: Swift
        run: |
          set -e
          : > abi.txt
          echo "===== DEFINIDOS =====" >> abi.txt
          nm -a "$BIN" 2>/dev/null | grep ' [tT] ' | grep '\$s' | wc -l >> abi.txt || true
          echo "===== PATCH =====" >> abi.txt
          nm -a "$BIN" 2>/dev/null | grep ' [tT] ' | grep '\$s' | grep -Ei 'patch|apply|restore|install' | head -80 >> abi.txt || true
      - name: Publicar
        run: |
          git config user.name veex-bot
          git config user.email bot@veex.local
          git add -f abi.txt
          git commit -m abi || true
          git push || true
      - uses: actions/upload-artifact@v4
        with:
          name: abi
          path: abi.txt
