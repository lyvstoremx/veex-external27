name: ios27-abi
on: workflow_dispatch
jobs:
  abi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get -y install llvm unzip binutils >/dev/null
      - name: IPA
        run: |
          set -e
          git clone --depth 1 "https://github.com/lyvstoremx/VEEX-EXTERNAL.git" "$RUNNER_TEMP/old"
          cp "$RUNNER_TEMP/old/3105ios27.ipa" "$GITHUB_WORKSPACE/3105ios27.ipa"
          ls -lh "$GITHUB_WORKSPACE/3105ios27.ipa"
      - name: Desplegar
        run: |
          set -e
          W="$GITHUB_WORKSPACE/work"
          mkdir -p "$W" && cd "$W"
          unzip -o "$GITHUB_WORKSPACE/3105ios27.ipa" >/dev/null
          APP=$(find "$W/Payload" -maxdepth 1 -name '*.app' | head -1)
          BIN="$APP/$(python3 -c "import plistlib,sys;print(plistlib.load(open(sys.argv[1],'rb'))['CFBundleExecutable'])" "$APP/Info.plist")"
          echo "APP=$APP" >> $GITHUB_ENV
          echo "BIN=$BIN" >> $GITHUB_ENV
          ls -lh "$BIN"
      - name: Frameworks
        run: ls -R "$APP" | head -80
      - name: Cadenas
        run: strings -a "$BIN" | grep -iE 'worse|bad_query|airlift|mcm_' | sort -u | head -80
      - name: Pairing y afc
        run: strings -a "$BIN" | grep -iE 'pair|rppair|afc|house|mha|airlift|lockdown' | sort -u | head -100
      - name: Pairing en el IPA
        run: find "$APP" -iname '*pair*' -o -iname '*.mobiledevicepairing' | head -20
      - name: Simbolos todos
        run: llvm-nm -a "$BIN" 2>/dev/null | grep -iE 'worse|query|sandbox' | head -80
      - name: Simbolos C
        run: llvm-nm --defined-only "$BIN" | grep -v '_ZN' | grep -iE 'pair|afc|tunnel|lockdown|escrow|service|session|mha|house' | head -150
      - name: Simbolos
        run: llvm-nm --defined-only "$BIN" | grep -iE 'worse|supportpolicy|isSupported|sandbox_extension' | head -80
      - name: Llamadores pairing
        run: |
          llvm-objdump -d --macho "$BIN" > dis.txt || true
          grep -n -B 20 -E 'pair_setup|get_pairing_file|save_pair_record_on_peer|request_pair_consent' dis.txt | head -300
